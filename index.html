<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e2f5c" />
    <title>LSB Handicrafts</title>

    <!--
      Manrope, the one family in the design system. Loaded here rather than
      @import-ed from index.css so the request starts during HTML parse instead
      of waiting for the stylesheet to arrive first.

      Weights are the five the handoff uses; `display=swap` means the fallback
      stack in tailwind.config.js paints immediately rather than leaving the
      first render blank on a slow connection.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
