<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add user dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="add-user-title" aria-describedby="add-user-desc" style="position: relative; box-sizing: border-box; width: 480px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px;">

<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>

<div style="padding: 20px 52px 0 20px;">
<h2 id="add-user-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Add user</h2>
<p id="add-user-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">They get an email invite and choose their own password.</p>
</div>

<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="au-name" style="font-size: 14px; font-weight: 500;">Full name</label>
<input id="au-name" type="text" autocomplete="off" placeholder="Juan Dela Cruz" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="au-email" style="font-size: 14px; font-weight: 500;">Work email</label>
<input id="au-email" type="email" autocomplete="off" placeholder="name@lsbhandicrafts.ph" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 2px solid var(--primary, #004E89); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 0 0 3px rgba(0,78,137,0.15);">
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<span id="au-role-label" style="font-size: 14px; font-weight: 500;">Role</span>
<button type="button" aria-haspopup="listbox" aria-labelledby="au-role-label au-role-value" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;"><span id="au-role-value">Sales Staff</span><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--muted-fg, #71717a)"><path d="M80 176l48 48 48-48M80 80l48-48 48 48"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<span id="au-dept-label" style="font-size: 14px; font-weight: 500;">Department</span>
<button type="button" aria-haspopup="listbox" aria-labelledby="au-dept-label au-dept-value" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;"><span id="au-dept-value">Sales</span><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--muted-fg, #71717a)"><path d="M80 176l48 48 48-48M80 80l48-48 48 48"></path></svg></button>
</div>
</div>
<p style="margin: -6px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Sales Staff can create orders and customers, and see stock. They cannot change prices or staff.</p>

<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px;">
<div>
<label for="au-invite" style="display: block; font-size: 14px; font-weight: 500;">Send the invite now</label>
<span style="display: block; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Turn off to set the account up first and invite later.</span>
</div>
<button type="button" role="switch" id="au-invite" aria-checked="{{invite}}" onClick="{{toggleInvite}}" style="flex: none; position: relative; width: 32px; height: 18px; padding: 0; border: 0; border-radius: 9px; background: {{trackBg}}; cursor: pointer;"><span style="position: absolute; top: 2px; left: {{thumbLeft}}; width: 14px; height: 14px; border-radius: 50%; background: var(--thumb, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.2);"></span></button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">{{cta}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":480,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const invite = s.invite ?? true;
    return {
      invite,
      trackBg: invite ? 'var(--primary, #004E89)' : 'var(--muted-strong, #e4e4e7)',
      thumbLeft: invite ? '16px' : '2px',
      cta: invite ? 'Add and send invite' : 'Add user',
      toggleInvite: () => this.setState({ invite: !invite }),
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
