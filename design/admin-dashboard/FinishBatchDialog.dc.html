<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Finish batch dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="fb-title" aria-describedby="fb-desc" style="position: relative; box-sizing: border-box; width: 560px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums;">
<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>
<div style="padding: 20px 52px 0 20px;">
<h2 id="fb-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Count and finish {{batchId}}</h2>
<p id="fb-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">{{product}} · {{planned}} planned. Good pieces go onto the shelf; material is used up now.</p>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="fb-good" style="font-size: 14px; font-weight: 500;">Good pieces</label><input id="fb-good" type="text" inputmode="numeric" value="{{good}}" onChange="{{onGood}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: right; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><span style="font-size: 14px; font-weight: 500;">Damaged</span><span style="display: flex; align-items: center; justify-content: flex-end; height: 32px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--surface-2, #fafafa); font-size: 14px; font-weight: 500;">{{badTotal}}</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 14px; font-weight: 500;">Why pieces were damaged</span>
<div role="table" aria-label="Damaged pieces by reason" style="border: 1px solid var(--border, #d4d4d8); border-radius: 6px; overflow: hidden; font-size: 13px;">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
<div role="row" style="display: grid; grid-template-columns: 1fr 96px; align-items: center; height: 40px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--row-divider, #f4f4f5);">
<div role="cell"><label for="fb-r-{{r.key}}">{{r.label}}</label></div>
<div role="cell"><input id="fb-r-{{r.key}}" type="text" inputmode="numeric" value="{{r.n}}" onChange="{{r.onN}}" style="width: 100%; height: 28px; box-sizing: border-box; padding: 0 8px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 13px; text-align: right;"></div>
</div>
</sc-for>
</div>
</div>

<sc-if value="{{mismatch}}" hint-placeholder-val="{{false}}"><p style="margin: -4px 0 0; font-size: 13px; line-height: 18px; color: var(--warning-fg, #b45309);">{{mismatchText}}</p></sc-if>

<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 14px; font-weight: 500;">Material actually used</span>
<div style="border: 1px solid var(--border, #d4d4d8); border-radius: 6px; overflow: hidden; font-size: 13px;">
<div style="display: grid; grid-template-columns: 1fr 120px 96px; align-items: center; height: 40px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--row-divider, #f4f4f5);"><label for="fb-m1">EPS block, raw</label><span style="color: var(--muted-fg, #71717a);">2 set aside</span><div style="display: flex; align-items: center; height: 28px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px;"><input id="fb-m1" type="text" inputmode="numeric" defaultValue="2" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 8px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 13px; text-align: right;"><span style="padding-right: 8px; font-size: 11px; color: var(--muted-fg, #71717a);">blk</span></div></div>
<div style="display: grid; grid-template-columns: 1fr 120px 96px; align-items: center; height: 40px; padding: 0 6px 0 12px;"><label for="fb-m2">Hot-wire, nichrome</label><span style="color: var(--muted-fg, #71717a);">6 m set aside</span><div style="display: flex; align-items: center; height: 28px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px;"><input id="fb-m2" type="text" inputmode="numeric" defaultValue="5" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 8px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 13px; text-align: right;"><span style="padding-right: 8px; font-size: 11px; color: var(--muted-fg, #71717a);">m</span></div></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--surface-2, #fafafa); font-size: 13px; line-height: 18px;">
<div style="display: flex; justify-content: space-between;"><span style="color: var(--muted-fg, #71717a);">Onto the shelf</span><span style="font-weight: 600;">+{{goodN}} {{product}}</span></div>
<div style="display: flex; justify-content: space-between;"><span style="color: var(--muted-fg, #71717a);">Damage rate</span><span style="color: {{rateColor}}; font-weight: 500;">{{rate}}</span></div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Not yet</button>
<button type="button" onClick="{{confirm}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Finish batch</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"batchId":{"editor":"text","default":"B-0318"},"product":{"editor":"text","default":"Foam block, 12 inch"},"planned":{"editor":"int","default":40},"onClose":{"editor":null},"onConfirm":{"editor":null},"$preview":{"width":560,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const planned = parseInt(p.planned ?? 40, 10);
    const good = s.good ?? String(planned - 1);
    const counts = s.counts ?? { cut: '1', crushed: '0', density: '0', other: '0' };
    const R = [['cut', 'Broke while being cut'], ['crushed', 'Crushed or dented'], ['density', 'Wrong density or thickness'], ['other', 'Something else']];
    const reasons = R.map(([key, label]) => ({
      key, label, n: counts[key],
      onN: (e) => this.setState({ counts: { ...counts, [key]: e.target.value.replace(/[^0-9]/g, '') } })
    }));
    const bad = R.reduce((a, [k]) => a + (parseInt(counts[k], 10) || 0), 0);
    const g = parseInt(good, 10) || 0;
    const total = g + bad;
    const rate = total ? (bad / total) * 100 : 0;
    const gap = planned - total;
    return {
      batchId: p.batchId ?? 'B-0318',
      product: p.product ?? 'Foam block, 12 inch',
      planned, good, reasons,
      badTotal: bad,
      goodN: g,
      rate: rate.toFixed(1) + '%',
      rateColor: rate >= 3 ? 'var(--warning-fg, #b45309)' : 'var(--foreground, #09090b)',
      mismatch: gap !== 0,
      mismatchText: gap > 0 ? gap + ' fewer than planned. Count them as damaged if they went missing.' : (-gap) + ' more than planned. Check the counts before finishing.',
      onGood: (e) => this.setState({ good: e.target.value.replace(/[^0-9]/g, '') }),
      confirm: () => { if (typeof p.onConfirm === 'function') p.onConfirm(); else if (typeof p.onClose === 'function') p.onClose(); },
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
