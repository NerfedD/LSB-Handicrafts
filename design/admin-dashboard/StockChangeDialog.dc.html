<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stock change dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="sk-title" style="position: relative; box-sizing: border-box; width: 480px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums;">
<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>
<div style="padding: 20px 52px 0 20px;">
<h2 id="sk-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">{{item}}</h2>
<p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">The system has {{onHand}} {{unit}} on hand.</p>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div class="seg2" data-on="{{isOff}}" role="tablist" aria-label="What to record" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; gap: 2px; border-radius: 8px; --seg-p: 3px; --seg-r: 6px; background: var(--muted, #f4f4f5);">
<span class="seg-ind" aria-hidden="true"></span>
<button type="button" role="tab" aria-selected="{{isCount}}" onClick="{{showCount}}" style="height: 28px; border: 0; border-radius: 6px; background: {{tc.bg}}; box-shadow: {{tc.shadow}}; color: {{tc.fg}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Count what's there</button>
<button type="button" role="tab" aria-selected="{{isOff}}" onClick="{{showOff}}" style="height: 28px; border: 0; border-radius: 6px; background: {{to.bg}}; box-shadow: {{to.shadow}}; color: {{to.fg}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Write off damage</button>
</div>

<sc-if value="{{isCount}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 220px;"><label for="sk-count" style="font-size: 14px; font-weight: 500;">You counted</label><div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><input id="sk-count" type="text" inputmode="numeric" value="{{counted}}" onChange="{{onCount}}" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 10px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: right;"><span style="padding-right: 10px; font-size: 12px; color: var(--muted-fg, #71717a);">{{unit}}</span></div></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--surface-2, #fafafa); font-size: 13px;"><span style="color: var(--muted-fg, #71717a);">Difference</span><span style="display: inline-flex; align-items: center; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 4px; border: 1px solid {{diff.bd}}; background: {{diff.bg}}; color: {{diff.fg}}; font-size: 12px; font-weight: 500;">{{diff.label}}</span></div>
<sc-if value="{{hasDiff}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="sk-why" style="font-size: 14px; font-weight: 500;">Most likely reason</span>
<div role="radiogroup" aria-labelledby="sk-why" style="display: flex; flex-direction: column; gap: 2px;">
<sc-for list="{{countReasons}}" as="r" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{r.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}};"></span></span>{{r.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
</div>
</sc-if>

<sc-if value="{{isOff}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 220px;"><label for="sk-off" style="font-size: 14px; font-weight: 500;">How much to write off</label><div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><input id="sk-off" type="text" inputmode="numeric" value="{{off}}" onChange="{{onOff}}" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 10px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: right;"><span style="padding-right: 10px; font-size: 12px; color: var(--muted-fg, #71717a);">{{unit}}</span></div></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="sk-offwhy" style="font-size: 14px; font-weight: 500;">What happened</span>
<div role="radiogroup" aria-labelledby="sk-offwhy" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px;">
<sc-for list="{{offReasons}}" as="r" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{r.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}};"></span></span>{{r.label}}</button>
</sc-for>
</div>
</div>
<p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Leaves {{after}} {{unit}} on hand. A manager can undo this from the stock history.</p>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 6px;"><label for="sk-note" style="font-size: 14px; font-weight: 500;">Note <span style="font-weight: 400; color: var(--muted-fg, #71717a);">(optional)</span></label><input id="sk-note" type="text" placeholder="Where, who noticed, anything that helps next time" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">{{cta}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["count","writeoff"],"default":"count"},"item":{"editor":"text","default":"Glue, foam-safe"},"unit":{"editor":"text","default":"L"},"onHand":{"editor":"int","default":3},"onClose":{"editor":null},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const mode = s.mode ?? (p.mode ?? 'count');
    const unit = p.unit ?? 'L';
    const onHand = parseInt(p.onHand ?? 3, 10);
    const counted = s.counted ?? String(onHand - 1);
    const off = s.off ?? '1';
    const cr = s.cr ?? 'used';
    const orr = s.orr ?? 'damaged';
    const c = parseInt(counted, 10);
    const d = isNaN(c) ? 0 : c - onHand;
    const radio = (on) => ({ bd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)', dot: on ? 'var(--primary, #004E89)' : 'transparent' });
    const countReasons = [['used', 'Used without being recorded'], ['miscount', 'Counted wrong last time'], ['other', 'Something else']]
      .map(([v, label]) => ({ label, on: v === cr, ...radio(v === cr), pick: () => this.setState({ cr: v }) }));
    const offReasons = [['damaged', 'Damaged in storage'], ['spilled', 'Spilled or leaked'], ['expired', 'Dried out or expired'], ['other', 'Something else']]
      .map(([v, label]) => ({ label, on: v === orr, ...radio(v === orr), pick: () => this.setState({ orr: v }) }));
    const isCount = mode === 'count';
    const on = { bg: 'var(--card, #ffffff)', shadow: '0 1px 2px rgba(0,0,0,0.06)', fg: 'var(--foreground, #09090b)' };
    const offS = { bg: 'transparent', shadow: 'none', fg: 'var(--muted-fg, #71717a)' };
    const diff = d === 0
      ? { label: 'Matches', bg: 'var(--success-bg, #f0fdf4)', fg: 'var(--success-fg, #15803d)', bd: 'var(--success-bd, #dcfce7)' }
      : d < 0
        ? { label: (-d) + ' ' + unit + ' missing', bg: 'var(--warning-bg, #fffbeb)', fg: 'var(--warning-fg, #b45309)', bd: 'var(--warning-bd, #fef3c7)' }
        : { label: d + ' ' + unit + ' more than expected', bg: 'var(--muted, #f4f4f5)', fg: 'var(--ink, #18181b)', bd: 'var(--border, #d4d4d8)' };
    const o = parseInt(off, 10) || 0;
    return {
      item: p.item ?? 'Glue, foam-safe', unit, onHand,
      isCount, isOff: !isCount, tc: isCount ? on : offS, to: isCount ? offS : on,
      counted, off, diff, hasDiff: d !== 0, countReasons, offReasons,
      after: Math.max(0, onHand - o),
      cta: isCount ? 'Save count' : 'Write off ' + o + ' ' + unit,
      showCount: () => this.setState({ mode: 'count' }),
      showOff: () => this.setState({ mode: 'writeoff' }),
      onCount: (e) => this.setState({ counted: e.target.value.replace(/[^0-9]/g, '') }),
      onOff: (e) => this.setState({ off: e.target.value.replace(/[^0-9]/g, '') }),
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
