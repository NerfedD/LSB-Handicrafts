<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:var(--card, #ffffff)}</style>
</helmet>
<div style="width: 1080px; height: 900px; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 20px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px;">
<div>
<h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em;">Sidebar states</h1>
<p style="margin: 2px 0 0; font-size: 13px; color: var(--muted-fg, #71717a);">variant="inset" · collapsible="icon" · 15rem open, 3rem as icons · Ctrl+B or ⌘B toggles · below 768px it opens as a Sheet</p>
</div>
<div style="display: flex; gap: 32px; align-items: flex-start;">

<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 12px; font-weight: 500; color: var(--muted-fg, #71717a);">Open · Settings expanded</span>
<div style="width: 240px; height: 760px; border: 1px solid var(--border-subtle, #e4e4e7); border-radius: 8px; overflow: hidden;">
<dc-import name="AppSidebar" active="users" settings-open="{{yes}}" h="760" hint-size="240px,760px"></dc-import>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 12px; font-weight: 500; color: var(--muted-fg, #71717a);">Collapsed · tooltip on hover</span>
<div style="width: 200px; height: 760px; position: relative;">
<div style="width: 48px; height: 760px; border: 1px solid var(--border-subtle, #e4e4e7); border-radius: 8px;">
<dc-import name="AppSidebar" active="users" collapsed="{{yes}}" tooltip="{{yes}}" h="758" hint-size="48px,758px"></dc-import>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 12px; font-weight: 500; color: var(--muted-fg, #71717a);">Account menu open</span>
<div style="width: 480px; height: 760px; position: relative;">
<div style="width: 240px; height: 760px; border: 1px solid var(--border-subtle, #e4e4e7); border-radius: 8px;">
<dc-import name="AppSidebar" active="dashboard" user-menu="{{yes}}" h="758" hint-size="240px,758px"></dc-import>
</div>
</div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
