<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New supplier order dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="so-title" aria-describedby="so-desc" style="position: relative; box-sizing: border-box; width: 520px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums;">
<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>
<div style="padding: 20px 52px 0 20px;">
<h2 id="so-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">New supplier order</h2>
<p id="so-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Nothing is added to stock until the delivery is received and counted.</p>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><span id="so-mat-label" style="font-size: 14px; font-weight: 500;">Material</span><button type="button" aria-haspopup="listbox" aria-labelledby="so-mat-label so-mat-value" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;"><span id="so-mat-value" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Glue, foam-safe</span><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; stroke: var(--muted-fg, #71717a)"><path d="M80 176l48 48 48-48M80 80l48-48 48 48"></path></svg></button></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><span id="so-sup-label" style="font-size: 14px; font-weight: 500;">Supplier</span><button type="button" aria-haspopup="listbox" aria-labelledby="so-sup-label so-sup-value" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;"><span id="so-sup-value">Foamtech Manila</span><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--muted-fg, #71717a)"><path d="M80 176l48 48 48-48M80 80l48-48 48 48"></path></svg></button></div>
</div>
<div style="display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--danger-bd, #fee2e2); border-radius: 6px; background: var(--danger-bg, #fef2f2); font-size: 13px; line-height: 18px; color: var(--fg-2, #3f3f46);"><span style="width: 6px; height: 6px; margin-top: 6px; border-radius: 50%; background: var(--danger, #b91c1c); flex: none;"></span><span>3 L on hand, 5 L set aside for batches: <strong style="font-weight: 600;">short by 2 L.</strong> Order more below 4 L. Foamtech usually takes 3–5 days.</span></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="so-qty" style="font-size: 14px; font-weight: 500;">How much</label><div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><input id="so-qty" type="text" inputmode="numeric" value="{{qty}}" onChange="{{onQty}}" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 10px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: right;"><span style="padding-right: 10px; font-size: 12px; color: var(--muted-fg, #71717a);">L</span></div></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="so-price" style="font-size: 14px; font-weight: 500;">Agreed price</label><div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><span aria-hidden="true" style="padding-left: 10px; color: var(--muted-fg, #71717a);">₱</span><input id="so-price" type="text" inputmode="decimal" value="{{price}}" onChange="{{onPrice}}" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 6px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: right;"><span style="padding-right: 10px; font-size: 12px; color: var(--muted-fg, #71717a);">/ L</span></div></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="so-when" style="font-size: 14px; font-weight: 500;">Expected</label><input id="so-when" type="text" defaultValue="Mon, Nov 3" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
</div>
<p style="margin: -6px 0 0; font-size: 12px; line-height: 16px; color: var(--muted-fg, #71717a);">Last paid ₱380.00 / L on Oct 2.</p>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="so-note" style="font-size: 14px; font-weight: 500;">Note to the supplier <span style="font-weight: 400; color: var(--muted-fg, #71717a);">(optional)</span></label><textarea id="so-note" rows="2" placeholder="Delivery instructions, brand, packaging" style="box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; line-height: 20px; resize: vertical; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></textarea></div>
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--surface-2, #fafafa); font-size: 13px;"><span style="color: var(--muted-fg, #71717a);">Order total</span><span style="font-size: 16px; font-weight: 600;">{{total}}</span></div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Place order</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":520,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const qty = s.qty ?? '10';
    const price = s.price ?? '380.00';
    const n = parseFloat(String(qty).replace(/[^0-9.]/g, '')) || 0;
    const pr = parseFloat(String(price).replace(/[^0-9.]/g, '')) || 0;
    return {
      qty, price,
      total: '₱' + (n * pr).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
      onQty: (e) => this.setState({ qty: e.target.value.replace(/[^0-9]/g, '') }),
      onPrice: (e) => this.setState({ price: e.target.value }),
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
