<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add customer dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="ac-title" aria-describedby="ac-desc" style="position: relative; box-sizing: border-box; width: 520px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px;">
<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>
<div style="padding: 20px 52px 0 20px;">
<h2 id="ac-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">{{title}}</h2>
<p id="ac-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Who orders, how to reach them, and where deliveries go.</p>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="ac-name" style="font-size: 14px; font-weight: 500;">Customer name</label><input id="ac-name" type="text" defaultValue="{{name}}" placeholder="Shop, school or person" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="ac-kind" style="font-size: 14px; font-weight: 500;">Kind</span>
<div role="radiogroup" aria-labelledby="ac-kind" style="display: flex; flex-wrap: wrap; gap: 4px 20px;">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{k.on}}" onClick="{{k.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{k.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{k.dot}};"></span></span>{{k.label}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="ac-contact" style="font-size: 14px; font-weight: 500;">Contact person</label><input id="ac-contact" type="text" defaultValue="{{contact}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="ac-phone" style="font-size: 14px; font-weight: 500;">Phone</label><input id="ac-phone" type="tel" defaultValue="{{phone}}" placeholder="0917 000 0000" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="ac-email" style="font-size: 14px; font-weight: 500;">Email <span style="font-weight: 400; color: var(--muted-fg, #71717a);">(optional)</span></label><input id="ac-email" type="email" defaultValue="{{email}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><span id="ac-area-label" style="font-size: 14px; font-weight: 500;">Area</span><button type="button" aria-haspopup="listbox" aria-labelledby="ac-area-label ac-area-value" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;"><span id="ac-area-value">{{area}}</span><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--muted-fg, #71717a)"><path d="M80 176l48 48 48-48M80 80l48-48 48 48"></path></svg></button></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="ac-addr" style="font-size: 14px; font-weight: 500;">Delivery address</label><textarea id="ac-addr" rows="2" defaultValue="{{address}}" style="box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; line-height: 20px; resize: vertical; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></textarea></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="ac-note" style="font-size: 14px; font-weight: 500;">Notes for the team <span style="font-weight: 400; color: var(--muted-fg, #71717a);">(optional)</span></label><textarea id="ac-note" rows="2" defaultValue="{{note}}" placeholder="Gate to use, best time to deliver, how they like to pay" style="box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; line-height: 20px; resize: vertical; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></textarea></div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">{{cta}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["add","edit"],"default":"add"},"onClose":{"editor":null},"$preview":{"width":520,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const edit = p.mode === 'edit';
    const kind = s.kind ?? (edit ? 'business' : 'business');
    const kinds = [['business', 'Business'], ['school', 'School or church'], ['person', 'Person']].map(([v, label]) => {
      const on = v === kind;
      return { label, on, bd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)', dot: on ? 'var(--primary, #004E89)' : 'transparent', pick: () => this.setState({ kind: v }) };
    });
    const d = edit
      ? { name: 'Bautista Party Supplies', contact: 'Rhea Bautista', phone: '0917 555 0142', email: 'orders@bautistaparty.ph', area: 'Matina', address: 'Stall 12, Matina Town Square, Davao City', note: 'Deliver before 10 AM. Use the back gate on MacArthur Highway.' }
      : { name: '', contact: '', phone: '', email: '', area: 'Choose an area', address: '', note: '' };
    return {
      ...d,
      kinds,
      title: edit ? 'Edit customer' : 'Add customer',
      cta: edit ? 'Save changes' : 'Add customer',
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
