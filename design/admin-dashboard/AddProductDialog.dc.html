<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add product dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="ap-title" aria-describedby="ap-desc" style="position: relative; box-sizing: border-box; width: 520px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums;">

<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>

<div style="padding: 20px 52px 0 20px;">
<h2 id="ap-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Add product</h2>
<p id="ap-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Something the shop sells. Its stock is counted from here on.</p>
</div>

<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">

<!-- Kind: radio cards -->
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="ap-kind-label" style="font-size: 14px; font-weight: 500;">Kind</span>
<div role="radiogroup" aria-labelledby="ap-kind-label" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{k.on}}" onClick="{{k.pick}}" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 6px 10px; border: 1px solid {{k.bd}}; border-radius: 6px; background: var(--card, #ffffff); box-shadow: {{k.ring}}; color: {{k.fg}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">
<span aria-hidden="true" style="position: absolute; top: 6px; left: 6px; width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{k.dotBd}}; background: var(--card, #ffffff); display: flex; align-items: center; justify-content: center;"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{k.dot}};"></span></span>
<sc-if value="{{k.isBall}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" aria-hidden="true"><circle cx="128" cy="128" r="88"></circle></svg></sc-if>
<sc-if value="{{k.isSheet}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round" aria-hidden="true"><rect x="40" y="40" width="176" height="176" rx="8"></rect></svg></sc-if>
<sc-if value="{{k.isBlock}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round" aria-hidden="true"><path d="M128 129.09V232M32.7 76.92 128 129.09l95.3-52.17M219.84 182.84l-88 48.18a8 8 0 0 1-7.68 0l-88-48.18a8 8 0 0 1-4.16-7V80.18a8 8 0 0 1 4.16-7l88-48.18a8 8 0 0 1 7.68 0l88 48.18a8 8 0 0 1 4.16 7v95.64a8 8 0 0 1-4.16 7Z"></path></svg></sc-if>
<sc-if value="{{k.isOther}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round" aria-hidden="true"><path d="M80 32 136 128H24Z"></path><rect x="144" y="40" width="80" height="80" rx="8"></rect><circle cx="100" cy="188" r="40"></circle></svg></sc-if>
{{k.label}}
</button>
</sc-for>
</div>
</div>

<div style="display: flex; gap: 12px; align-items: stretch;">
<button type="button" aria-label="Add a photo" style="flex: none; width: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border: 1px dashed var(--input-strong, #a1a1aa); border-radius: 6px; background: var(--surface-2, #fafafa); color: var(--muted-fg, #71717a); font: inherit; font-size: 12px; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M208 208H48a16 16 0 0 1-16-16V80a16 16 0 0 1 16-16h32l16-24h64l16 24h32a16 16 0 0 1 16 16v112a16 16 0 0 1-16 16Z"></path><circle cx="128" cy="132" r="36"></circle></svg>Photo</button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="ap-name" style="font-size: 14px; font-weight: 500;">Name</label>
<input id="ap-name" type="text" placeholder="{{namePlaceholder}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="ap-code" style="font-size: 14px; font-weight: 500;">Item code</label>
<input id="ap-code" type="text" placeholder="{{codePlaceholder}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
</div>
</div>
</div>

<!-- Sold: radio group -->
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="ap-unit-label" style="font-size: 14px; font-weight: 500;">Sold</span>
<div role="radiogroup" aria-labelledby="ap-unit-label" style="display: flex; flex-wrap: wrap; gap: 4px 20px;">
<sc-for list="{{units}}" as="u" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{u.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{u.dot}};"></span></span>{{u.label}}</button>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="ap-price" style="font-size: 14px; font-weight: 500;">Price</label>
<div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><span aria-hidden="true" style="padding: 0 0 0 10px; color: var(--muted-fg, #71717a);">₱</span><input id="ap-price" type="text" inputmode="decimal" placeholder="0.00" aria-describedby="ap-price-unit" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 6px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; outline-offset: 2px;"><span id="ap-price-unit" style="padding: 0 10px 0 0; font-size: 12px; color: var(--muted-fg, #71717a); white-space: nowrap;">{{unitShort}}</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="ap-open" style="font-size: 14px; font-weight: 500;">On the shelf</label>
<input id="ap-open" type="text" inputmode="numeric" placeholder="0" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="ap-reorder" style="font-size: 14px; font-weight: 500;">Warn me below</label>
<input id="ap-reorder" type="text" inputmode="numeric" placeholder="25" aria-describedby="ap-reorder-hint" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
</div>
</div>
<p id="ap-reorder-hint" style="margin: -6px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Below this number the product shows as running low.</p>
</div>

<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Add product</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":520,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const kind = s.kind ?? 'ball';
    const META = {
      ball: { label: 'Ball', name: 'Styro ball, 8 inch', code: 'SB-080', unit: 'each' },
      sheet: { label: 'Sheet', name: 'Styro sheet, 2 in, 4 × 8 ft', code: 'SS-200-4X8', unit: 'sheet' },
      block: { label: 'Block', name: 'Foam block, 18 inch', code: 'FB-180', unit: 'each' },
      other: { label: 'Other', name: 'Heart cutout, 10 inch', code: 'CP-HRT-10', unit: 'pack' }
    };
    // A picked unit wins; otherwise the kind suggests one.
    const unit = s.unit ?? META[kind].unit;
    const UNITS = [['each', 'Each', 'each'], ['sheet', 'Per sheet', 'per sheet'], ['pack', 'Per pack', 'per pack'], ['bundle', 'Per bundle', 'per bundle']];
    const radio = (on) => ({ bd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)', dot: on ? 'var(--primary, #004E89)' : 'transparent' });
    const kinds = Object.keys(META).map((k) => {
      const on = k === kind;
      return {
        label: META[k].label,
        on,
        bd: on ? 'var(--primary, #004E89)' : 'var(--border, #d4d4d8)',
        ring: on ? '0 0 0 1px var(--primary-text, #004E89)' : '0 1px 2px rgba(0,0,0,0.05)',
        fg: on ? 'var(--primary-text, #004E89)' : 'var(--fg-2, #3f3f46)',
        dotBd: radio(on).bd,
        dot: radio(on).dot,
        isBall: k === 'ball', isSheet: k === 'sheet', isBlock: k === 'block', isOther: k === 'other',
        pick: () => this.setState({ kind: k, unit: undefined })
      };
    });
    const units = UNITS.map(([v, label]) => ({
      label,
      on: v === unit,
      ...radio(v === unit),
      pick: () => this.setState({ unit: v })
    }));
    return {
      kinds,
      units,
      unitShort: UNITS.find((u) => u[0] === unit)[2],
      namePlaceholder: META[kind].name,
      codePlaceholder: META[kind].code,
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
