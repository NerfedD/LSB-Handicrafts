<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add role dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="ar-title" aria-describedby="ar-desc" style="position: relative; box-sizing: border-box; width: 480px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px;">
<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>
<div style="padding: 20px 52px 0 20px;">
<h2 id="ar-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Add a role</h2>
<p id="ar-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">You can fine-tune exactly what it can see and change after it's created.</p>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="ar-name" style="font-size: 14px; font-weight: 500;">Role name</label><input id="ar-name" type="text" placeholder="Cashier" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="ar-desc-in" style="font-size: 14px; font-weight: 500;">What they do <span style="font-weight: 400; color: var(--muted-fg, #71717a);">(optional)</span></label><input id="ar-desc-in" type="text" placeholder="Takes payments at the counter" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="ar-start" style="font-size: 14px; font-weight: 500;">Start with the permissions of</span>
<div role="radiogroup" aria-labelledby="ar-start" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px;">
<sc-for list="{{bases}}" as="b" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{b.on}}" onClick="{{b.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{b.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{b.dot}};"></span></span>{{b.label}}</button>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Add role</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":480,"height":440}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const base = s.base ?? 'sales';
    const bases = [['none', 'Nothing (start empty)'], ['sales', 'Sales Staff'], ['production', 'Production Staff'], ['delivery', 'Delivery Staff'], ['manager', 'Manager']].map(([v, label]) => {
      const on = v === base;
      return { label, on, bd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)', dot: on ? 'var(--primary, #004E89)' : 'transparent', pick: () => this.setState({ base: v }) };
    });
    return { bases, close: () => { if (typeof p.onClose === 'function') p.onClose(); } };
  }
}
</script>
</body>
</html>
