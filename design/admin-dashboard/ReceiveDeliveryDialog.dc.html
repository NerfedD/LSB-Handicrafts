<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receive delivery dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="rd-title" aria-describedby="rd-desc" style="position: relative; box-sizing: border-box; width: 520px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums;">
<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>
<div style="padding: 20px 52px 0 20px;">
<h2 id="rd-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Receive PO-0320</h2>
<p id="rd-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Glue, foam-safe from Foamtech Manila · 10 L ordered. Count what came off the truck.</p>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="rd-got" style="font-size: 14px; font-weight: 500;">Unloaded</label><div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><input id="rd-got" type="text" inputmode="numeric" value="{{got}}" onChange="{{onGot}}" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 10px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: right;"><span style="padding-right: 10px; font-size: 12px; color: var(--muted-fg, #71717a);">L</span></div></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="rd-bad" style="font-size: 14px; font-weight: 500;">Damaged or unusable</label><div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><input id="rd-bad" type="text" inputmode="numeric" value="{{bad}}" onChange="{{onBad}}" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 10px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: right;"><span style="padding-right: 10px; font-size: 12px; color: var(--muted-fg, #71717a);">L</span></div></div>
</div>
<sc-if value="{{hasBad}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="rd-why" style="font-size: 14px; font-weight: 500;">What was wrong</span>
<div role="radiogroup" aria-labelledby="rd-why" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px;">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{r.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{r.dot}};"></span></span>{{r.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--surface-2, #fafafa); font-size: 13px; line-height: 18px;">
<div style="display: flex; justify-content: space-between;"><span style="color: var(--muted-fg, #71717a);">Ordered</span><span>10 L</span></div>
<div style="display: flex; justify-content: space-between;"><span style="color: var(--muted-fg, #71717a);">Usable, goes into stock</span><span style="font-weight: 600;">{{usable}} L</span></div>
<div style="height: 1px; background: var(--border, #d4d4d8); margin: 2px 0;"></div>
<div style="display: flex; justify-content: space-between; align-items: center;"><span style="color: var(--muted-fg, #71717a);">Result</span><span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 4px; border: 1px solid {{result.bd}}; background: {{result.bg}}; color: {{result.fg}}; font-size: 12px; font-weight: 500;"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor;"></span>{{result.label}}</span></div>
</div>
<sc-if value="{{claim}}" hint-placeholder-val="{{false}}"><p style="margin: -4px 0 0; font-size: 13px; line-height: 18px; color: var(--fg-2, #3f3f46);">A claim opens for the difference so a manager can settle it with Foamtech.</p></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Not yet</button>
<button type="button" onClick="{{confirm}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Add {{usable}} L to stock</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"onConfirm":{"editor":null},"$preview":{"width":520,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const got = s.got ?? '10';
    const bad = s.bad ?? '1';
    const reason = s.reason ?? 'leak';
    const g = parseInt(got, 10) || 0;
    const b = Math.min(parseInt(bad, 10) || 0, g);
    const usable = g - b;
    const radio = (on) => ({ bd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)', dot: on ? 'var(--primary, #004E89)' : 'transparent' });
    const reasons = [['leak', 'Leaking or spilled'], ['crushed', 'Crushed in transit'], ['wet', 'Water or dirt damage'], ['wrong', 'Wrong item or grade']]
      .map(([v, label]) => ({ label, on: v === reason, ...radio(v === reason), pick: () => this.setState({ reason: v }) }));
    const claim = usable !== 10;
    const result = usable === 10
      ? { label: 'Complete', bg: 'var(--success-bg, #f0fdf4)', fg: 'var(--success-fg, #15803d)', bd: 'var(--success-bd, #dcfce7)' }
      : usable < 10
        ? { label: 'Short by ' + (10 - usable) + ' L', bg: 'var(--warning-bg, #fffbeb)', fg: 'var(--warning-fg, #b45309)', bd: 'var(--warning-bd, #fef3c7)' }
        : { label: (usable - 10) + ' L extra', bg: 'var(--warning-bg, #fffbeb)', fg: 'var(--warning-fg, #b45309)', bd: 'var(--warning-bd, #fef3c7)' };
    return {
      got, bad, usable, reasons, result, claim,
      hasBad: b > 0,
      onGot: (e) => this.setState({ got: e.target.value.replace(/[^0-9]/g, '') }),
      onBad: (e) => this.setState({ bad: e.target.value.replace(/[^0-9]/g, '') }),
      confirm: () => { if (typeof p.onConfirm === 'function') p.onConfirm(); else if (typeof p.onClose === 'function') p.onClose(); },
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
