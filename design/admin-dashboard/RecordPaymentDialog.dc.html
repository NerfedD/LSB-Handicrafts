<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record payment dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="rp-title" aria-describedby="rp-desc" style="position: relative; box-sizing: border-box; width: 480px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums;">
<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>
<div style="padding: 20px 52px 0 20px;">
<h2 id="rp-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Record a payment</h2>
<p id="rp-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Bautista Party Supplies owes ₱6,200.00 across 2 orders.</p>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="rp-for" style="font-size: 14px; font-weight: 500;">For</span>
<div role="radiogroup" aria-labelledby="rp-for" style="border: 1px solid var(--border, #d4d4d8); border-radius: 6px; overflow: hidden;">
<sc-for list="{{orders}}" as="o" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--row-divider, #f4f4f5); background: {{o.bg}}; color: var(--foreground, #09090b); font: inherit; text-align: left; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{o.bd}}; background: var(--card, #ffffff); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{o.dot}};"></span></span><span style="flex: 1; font-size: 13px;"><span style="font-weight: 500;">{{o.label}}</span> <span style="color: var(--muted-fg, #71717a);">{{o.sub}}</span></span><span style="font-size: 13px; font-weight: 500;">{{o.amountLabel}}</span></button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="rp-amt" style="font-size: 14px; font-weight: 500;">Amount received</label><div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><span aria-hidden="true" style="padding-left: 10px; color: var(--muted-fg, #71717a);">₱</span><input id="rp-amt" type="text" inputmode="decimal" value="{{amount}}" onChange="{{onAmount}}" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 10px 0 6px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: right;"></div></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="rp-date" style="font-size: 14px; font-weight: 500;">Received on</label><input id="rp-date" type="text" defaultValue="Tue, Oct 28" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="rp-how" style="font-size: 14px; font-weight: 500;">Paid by</span>
<div role="radiogroup" aria-labelledby="rp-how" style="display: flex; flex-wrap: wrap; gap: 4px 20px;">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{m.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{m.dot}};"></span></span>{{m.label}}</button>
</sc-for>
</div>
</div>
<sc-if value="{{needsRef}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="rp-ref" style="font-size: 14px; font-weight: 500;">Reference number</label><input id="rp-ref" type="text" placeholder="{{refHint}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
</sc-if>
<div style="display: flex; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--surface-2, #fafafa); font-size: 13px;"><span style="color: var(--muted-fg, #71717a);">Still to collect after this</span><span style="font-weight: 600; color: {{leftColor}};">{{left}}</span></div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Record payment</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":480,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const peso = (n) => '₱' + n.toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const pick = s.pick ?? 'all';
    const method = s.method ?? 'gcash';
    const ORDERS = [['all', 'Both orders', '', 6200], ['2048', '#2048', 'Pending · today', 2080], ['2051', '#2051', 'Ready to go · today', 4120]];
    const due = ORDERS.find((o) => o[0] === pick)[3];
    const amount = s.amount ?? due.toFixed(2);
    const paid = parseFloat(String(amount).replace(/[^0-9.]/g, '')) || 0;
    const radio = (on) => ({ bd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)', dot: on ? 'var(--primary, #004E89)' : 'transparent' });
    const orders = ORDERS.map(([v, label, sub, amt]) => ({
      label, sub, amountLabel: peso(amt), on: v === pick, bg: v === pick ? 'var(--muted, #f4f4f5)' : 'var(--card, #ffffff)', ...radio(v === pick),
      pick: () => this.setState({ pick: v, amount: amt.toFixed(2) })
    }));
    const methods = [['cash', 'Cash'], ['gcash', 'GCash'], ['bank', 'Bank transfer'], ['check', 'Check']].map(([v, label]) => ({
      label, on: v === method, ...radio(v === method), pick: () => this.setState({ method: v })
    }));
    const left = Math.max(0, 6200 - paid);
    return {
      orders, methods, amount,
      needsRef: method !== 'cash',
      refHint: method === 'check' ? 'Check number' : 'Reference from the receipt',
      left: left === 0 ? 'Nothing. All paid.' : peso(left),
      leftColor: left === 0 ? 'var(--success-fg, #15803d)' : 'var(--warning-fg, #b45309)',
      onAmount: (e) => this.setState({ amount: e.target.value }),
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
