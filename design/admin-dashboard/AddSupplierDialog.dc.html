<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add supplier dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="as2-title" aria-describedby="as2-desc" style="position: relative; box-sizing: border-box; width: 520px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px;">
<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>
<div style="padding: 20px 52px 0 20px;">
<h2 id="as2-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">{{title}}</h2>
<p id="as2-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Where the workshop buys from, and on what terms.</p>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="sp-name" style="font-size: 14px; font-weight: 500;">Supplier name</label><input id="sp-name" type="text" defaultValue="{{name}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="sp-city" style="font-size: 14px; font-weight: 500;">City</label><input id="sp-city" type="text" defaultValue="{{city}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="sp-contact" style="font-size: 14px; font-weight: 500;">Contact person</label><input id="sp-contact" type="text" defaultValue="{{contact}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;"><label for="sp-phone" style="font-size: 14px; font-weight: 500;">Phone</label><input id="sp-phone" type="tel" defaultValue="{{phone}}" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="sp-terms" style="font-size: 14px; font-weight: 500;">How we pay them</span>
<div role="radiogroup" aria-labelledby="sp-terms" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px;">
<sc-for list="{{terms}}" as="t" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{t.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{t.dot}};"></span></span>{{t.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 200px;"><label for="sp-lead" style="font-size: 14px; font-weight: 500;">Usually takes</label><div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><input id="sp-lead" type="text" inputmode="numeric" defaultValue="{{lead}}" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 10px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px;"><span style="padding-right: 10px; font-size: 12px; color: var(--muted-fg, #71717a);">days to arrive</span></div></div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="sp-mats" style="font-size: 14px; font-weight: 500;">What they supply</span>
<div role="group" aria-labelledby="sp-mats" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{mats}}" as="m" hint-placeholder-count="6">
<button type="button" role="checkbox" aria-checked="{{m.on}}" onClick="{{m.toggle}}" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 6px; border: 1px solid {{m.bd}}; border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 13px; cursor: pointer;"><span aria-hidden="true" style="width: 14px; height: 14px; box-sizing: border-box; border-radius: 3px; border: 1px solid {{m.boxBd}}; background: {{m.boxBg}}; display: inline-flex; align-items: center; justify-content: center; color: var(--on-primary, #ffffff);"><svg width="10" height="10" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" style="display: {{m.checkD}};"><path d="M40 144l56 56L224 72"></path></svg></span>{{m.label}}</button>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">{{cta}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["add","edit"],"default":"add"},"onClose":{"editor":null},"$preview":{"width":520,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const edit = p.mode === 'edit';
    const term = s.term ?? (edit ? 'd30' : 'cod');
    const picked = s.picked ?? (edit ? { eps: true, glue: true } : {});
    const radio = (on) => ({ bd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)', dot: on ? 'var(--primary, #004E89)' : 'transparent' });
    const terms = [['cod', 'Cash on delivery'], ['before', 'Paid before they send'], ['d15', '15 days after delivery'], ['d30', '30 days after delivery']]
      .map(([v, label]) => ({ label, on: v === term, ...radio(v === term), pick: () => this.setState({ term: v }) }));
    const mats = [['eps', 'EPS blocks'], ['glue', 'Glue'], ['paint', 'Spray paint'], ['glitter', 'Glitter'], ['ribbon', 'Ribbon'], ['wire', 'Hot-wire']].map(([v, label]) => {
      const on = !!picked[v];
      return {
        label, on,
        bd: on ? 'var(--primary, #004E89)' : 'var(--border, #d4d4d8)', boxBd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)', boxBg: on ? 'var(--primary, #004E89)' : 'var(--card, #ffffff)', checkD: on ? 'block' : 'none',
        toggle: () => this.setState({ picked: { ...picked, [v]: !on } })
      };
    });
    const d = edit
      ? { name: 'Foamtech Manila', city: 'Valenzuela, Metro Manila', contact: 'Rodel Santos', phone: '0917 812 3300', lead: '4' }
      : { name: '', city: '', contact: '', phone: '', lead: '' };
    return {
      ...d, terms, mats,
      title: edit ? 'Edit supplier' : 'Add supplier',
      cta: edit ? 'Save changes' : 'Add supplier',
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
