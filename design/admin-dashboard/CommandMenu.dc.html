<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-label="Search pages and actions" style="box-sizing: border-box; width: 560px; max-width: 100%; height: 400px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px;">
<div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-bottom: 1px solid var(--border, #d4d4d8);">
<svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--muted-fg, #71717a)"><circle cx="112" cy="112" r="80"></circle><path d="M168.57 168.57 224 224"></path></svg>
<label for="cmd-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search</label>
<input id="cmd-input" type="text" placeholder="Type a command or search…" autocomplete="off" style="flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px;">
<button type="button" onClick="{{close}}" style="flex: none; height: 20px; padding: 0 6px; border: 1px solid var(--border, #d4d4d8); border-radius: 4px; background: var(--muted, #f4f4f5); color: var(--muted-fg, #71717a); font: inherit; font-size: 11px; font-weight: 500; cursor: pointer;">Esc</button>
</div>
<div role="listbox" aria-label="Results" style="flex: 1; overflow-y: auto; padding: 4px;">
<div style="padding: 6px 8px 4px; font-size: 12px; font-weight: 500; color: var(--muted-fg, #71717a);">Pages</div>

<div role="separator" style="height: 1px; margin: 4px -4px; background: var(--muted-strong, #e4e4e7);"></div>
<div style="padding: 6px 8px 4px; font-size: 12px; font-weight: 500; color: var(--muted-fg, #71717a);">Actions</div>

<a role="option" aria-selected="false" href="Login.dc.html" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 4px; color: var(--foreground, #09090b); text-decoration: none;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--muted-fg, #71717a)"><path d="M112 216H48a8 8 0 0 1-8-8V48a8 8 0 0 1 8-8h64M112 128h104M176 88l40 40-40 40"></path></svg><span style="flex: 1;">Log out</span></a>
</div>
<div style="display: flex; align-items: center; gap: 16px; height: 36px; padding: 0 12px; border-top: 1px solid var(--border, #d4d4d8); font-size: 12px; color: var(--muted-fg, #71717a);">
<span style="display: inline-flex; align-items: center; gap: 6px;"><kbd style="display: inline-flex; align-items: center; height: 18px; padding: 0 4px; border: 1px solid var(--border, #d4d4d8); border-radius: 4px; background: var(--muted, #f4f4f5); font-family: inherit; font-size: 11px;">↑↓</kbd>Move</span>
<span style="display: inline-flex; align-items: center; gap: 6px;"><kbd style="display: inline-flex; align-items: center; height: 18px; padding: 0 4px; border: 1px solid var(--border, #d4d4d8); border-radius: 4px; background: var(--muted, #f4f4f5); font-family: inherit; font-size: 11px;">↵</kbd>Open</span>
<span style="display: inline-flex; align-items: center; gap: 6px;"><kbd style="display: inline-flex; align-items: center; height: 18px; padding: 0 4px; border: 1px solid var(--border, #d4d4d8); border-radius: 4px; background: var(--muted, #f4f4f5); font-family: inherit; font-size: 11px;">Esc</kbd>Close</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":560,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { close: () => { if (typeof p.onClose === 'function') p.onClose(); } };
  }
}
</script>
</body>
</html>
