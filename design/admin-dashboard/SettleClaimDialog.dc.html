<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settle claim dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="sc-title" aria-describedby="sc-desc" style="position: relative; box-sizing: border-box; width: 480px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums;">
<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>
<div style="padding: 20px 52px 0 20px;">
<h2 id="sc-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Settle the PO-0317 claim</h2>
<p id="sc-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">1 EPS block crushed in transit · ₱2,850.00 at stake with Foamtech Manila.</p>
</div>
<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="sc-how" style="font-size: 14px; font-weight: 500;">How it was settled</span>
<div role="radiogroup" aria-labelledby="sc-how" style="display: flex; flex-direction: column; gap: 2px;">
<sc-for list="{{outcomes}}" as="o" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="display: flex; align-items: flex-start; gap: 10px; padding: 8px; border: 0; border-radius: 6px; background: {{o.bg}}; color: var(--foreground, #09090b); font: inherit; text-align: left; cursor: pointer;"><span aria-hidden="true" style="flex: none; margin-top: 2px; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{o.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{o.dot}};"></span></span><span><span style="display: block; font-size: 14px; font-weight: 500;">{{o.label}}</span><span style="display: block; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">{{o.hint}}</span></span></button>
</sc-for>
</div>
</div>
<sc-if value="{{needsAmount}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 220px;"><label for="sc-amt" style="font-size: 14px; font-weight: 500;">{{amountLabel}}</label><div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><span aria-hidden="true" style="padding-left: 10px; color: var(--muted-fg, #71717a);">₱</span><input id="sc-amt" type="text" inputmode="decimal" defaultValue="2,850.00" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 10px 0 6px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: right;"></div></div>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 6px;"><label for="sc-note" style="font-size: 14px; font-weight: 500;">Note</label><textarea id="sc-note" rows="2" placeholder="Who you spoke to, and what they agreed" style="box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; line-height: 20px; resize: vertical; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></textarea></div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Keep it open</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Close the claim</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":480,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const pick = s.pick ?? 'credit';
    const O = [
      ['replace', 'They sent a replacement', 'Adds 1 block to stock when it arrives', ''],
      ['credit', 'Credit on our next order', 'Taken off the next Foamtech invoice', 'Credit amount'],
      ['refund', 'They refunded us', 'Money back for the damaged block', 'Refund amount'],
      ['writeoff', 'We absorb the loss', 'Nothing more is expected from Foamtech', '']
    ];
    const outcomes = O.map(([v, label, hint]) => {
      const on = v === pick;
      return { label, hint, on, bg: on ? 'var(--muted, #f4f4f5)' : 'transparent', bd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)', dot: on ? 'var(--primary, #004E89)' : 'transparent', pick: () => this.setState({ pick: v }) };
    });
    const cur = O.find((o) => o[0] === pick);
    return {
      outcomes,
      needsAmount: !!cur[3],
      amountLabel: cur[3],
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
