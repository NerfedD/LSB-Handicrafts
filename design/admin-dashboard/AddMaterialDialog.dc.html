<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add material dialog</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./theme.css">
<script src="./theme.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="dialog" aria-modal="true" aria-labelledby="am-title" aria-describedby="am-desc" style="position: relative; box-sizing: border-box; width: 480px; max-width: 100%; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; background: var(--card, #ffffff); color: var(--foreground, #09090b); box-shadow: 0 4px 16px rgba(0,0,0,0.08); font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; line-height: 20px;">

<button type="button" aria-label="Close" onClick="{{close}}" style="position: absolute; top: 12px; right: 12px; width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted-fg, #71717a); cursor: pointer;"><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M200 56L56 200M200 200L56 56"></path></svg></button>

<div style="padding: 20px 52px 0 20px;">
<h2 id="am-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600;">Add raw material</h2>
<p id="am-desc" style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--muted-fg, #71717a);">Something the workshop uses up to make products.</p>
</div>

<div style="padding: 16px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="am-name" style="font-size: 14px; font-weight: 500;">Name</label>
<input id="am-name" type="text" placeholder="Spray paint, gold" style="height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
</div>

<!-- Counted in: radio group -->
<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="am-unit-label" style="font-size: 14px; font-weight: 500;">Counted in</span>
<div role="radiogroup" aria-labelledby="am-unit-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px 12px;">
<sc-for list="{{units}}" as="u" hint-placeholder-count="6">
<button type="button" role="radio" aria-checked="{{u.on}}" onClick="{{u.pick}}" style="display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; cursor: pointer;"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{u.bd}}; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05); display: inline-flex; align-items: center; justify-content: center;"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{u.dot}};"></span></span>{{u.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<span id="am-sup-label" style="font-size: 14px; font-weight: 500;">Usual supplier</span>
<button type="button" aria-haspopup="listbox" aria-labelledby="am-sup-label am-sup-value" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 32px; padding: 0 8px 0 10px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;"><span id="am-sup-value">Davao Paint Center</span><svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke: var(--muted-fg, #71717a)"><path d="M80 176l48 48 48-48M80 80l48-48 48 48"></path></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="am-open" style="font-size: 14px; font-weight: 500;">On hand now</label>
<div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><input id="am-open" type="text" inputmode="numeric" placeholder="0" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 10px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; outline-offset: 2px;"><span style="padding: 0 10px 0 0; font-size: 12px; color: var(--muted-fg, #71717a);">{{unitWord}}</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0;">
<label for="am-reorder" style="font-size: 14px; font-weight: 500;">Order more below</label>
<div style="display: flex; align-items: center; height: 32px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><input id="am-reorder" type="text" inputmode="numeric" placeholder="10" style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; padding: 0 4px 0 10px; border: 0; background: transparent; color: var(--foreground, #09090b); font: inherit; font-size: 14px; outline-offset: 2px;"><span style="padding: 0 10px 0 0; font-size: 12px; color: var(--muted-fg, #71717a);">{{unitWord}}</span></div>
</div>
</div>
<div style="display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--surface-2, #fafafa); font-size: 13px; line-height: 18px; color: var(--fg-2, #3f3f46);">
<svg width="16" height="16" viewBox="0 0 256 256" fill="none" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; stroke: var(--muted-fg, #71717a)"><circle cx="128" cy="128" r="96"></circle><path d="M120 120h8v56h8M124 84h.01"></path></svg>
<span>Count what is on the shelf today. After this, stock only comes in when a supplier order is received.</span>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 0 20px 20px;">
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--border, #d4d4d8); border-radius: 6px; background: var(--card, #ffffff); color: var(--foreground, #09090b); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Cancel</button>
<button type="button" onClick="{{close}}" style="height: 32px; padding: 0 12px; border: 1px solid var(--primary, #004E89); border-radius: 6px; background: var(--primary, #004E89); color: var(--on-primary, #ffffff); font: inherit; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">Add material</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":480,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const p = this.props;
    const unit = s.unit ?? 'cans';
    const UNITS = [['blocks', 'Blocks'], ['meters', 'Meters'], ['cans', 'Cans'], ['liters', 'Liters'], ['kg', 'Kilograms'], ['packs', 'Packs']];
    const units = UNITS.map(([v, label]) => {
      const on = v === unit;
      return {
        label,
        on,
        bd: on ? 'var(--primary, #004E89)' : 'var(--input-strong, #a1a1aa)',
        dot: on ? 'var(--primary, #004E89)' : 'transparent',
        pick: () => this.setState({ unit: v })
      };
    });
    return {
      units,
      unitWord: unit === 'kg' ? 'kg' : unit,
      close: () => { if (typeof p.onClose === 'function') p.onClose(); }
    };
  }
}
</script>
</body>
</html>
